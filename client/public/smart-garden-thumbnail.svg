<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Smart Garden CMS thumbnail</title>
  <desc id="desc">Blue project thumbnail for a smart garden monitoring and watering dashboard.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4FBFF"/>
