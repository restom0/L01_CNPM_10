    <linearGradient id="card" x1="720" y1="112" x2="1060" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5FCFF"/>
    </linearGradient>
    <filter id="shadow" x="640" y="70" width="490" height="500" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0A3A72" flood-opacity="0.16"/>
    </filter>
  </defs>

