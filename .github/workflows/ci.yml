name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only check out and build/test, no writes needed.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test (unit + integration + API) with coverage
        run: npm run test:coverage
        env:
          JWT_SECRET: ci-test-secret
          NODE_ENV: test

      - name: Upload server coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage-node-${{ matrix.node-version }}
          path: server/coverage
          if-no-files-found: ignore

  client:
    name: client (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test (component) with coverage
        run: npm run test:coverage

      - name: Upload client coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage-node-${{ matrix.node-version }}
          path: client/coverage
          if-no-files-found: ignore

  sonar:
    name: sonar
    runs-on: ubuntu-latest
    needs: [server, client]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install server dependencies
        working-directory: server
        run: npm ci --ignore-scripts

      - name: Test server with coverage
        working-directory: server
        run: npm run test:coverage
        env:
          JWT_SECRET: ci-test-secret
          NODE_ENV: test

      - name: Install client dependencies
        working-directory: client
        run: npm ci --ignore-scripts

      - name: Test client with coverage
        working-directory: client
        run: npm run test:coverage

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'L01_CNPM_10' }}
